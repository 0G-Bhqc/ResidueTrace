<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 246" width="760" height="246" role="img" aria-labelledby="title desc">
  <title id="title">Two names for one residue, or a different residue?</title>
  <desc id="desc">3B9F, model 1. Figure label H:77A matches standard label B:73, but not B:74. The labels are from archived atom records; the pairings are illustrative.</desc>
  <rect x="1" y="1" width="758" height="244" rx="16" fill="#122b32" stroke="#435a60"/>
  <g font-family="system-ui,Segoe UI,sans-serif">
    <path d="M28 33h18m-14 6h10m-6 6h10" fill="none" stroke="#78dbbb" stroke-width="3" stroke-linecap="round"/>
    <text x="59" y="42" font-size="17" fill="#e9f4f1" font-weight="650">ResidueTrace</text>
    <text x="730" y="42" text-anchor="end" fill="#bdd3d1" font-size="16">PDB 3B9F  /  MODEL 1</text>
    <path d="M28 61h704M28 156h704" stroke="#37515a"/>
    <g font-size="16" fill="#bdd3d1"><text x="35" y="91">FIGURE · AUTHOR ID</text><text x="321" y="91">TABLE · LABEL ID</text><text x="572" y="91">VERDICT</text></g>
    <g font-family="ui-monospace,Consolas,monospace" font-size="37" font-weight="700" fill="#f1f7f4">
      <text x="34" y="137">H:77A</text><text x="320" y="137">B:73</text>
      <text x="34" y="206">H:77A</text><text x="320" y="206">B:74</text>
    </g>
    <g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M202 125h75m-8-7 8 7-8 7" stroke="#78dbbb"/>
      <path d="M202 195h26m21 0h27m-41-7 10 13m0-13-10 13" stroke="#ffb69f"/>
    </g>
    <text x="572" y="134" fill="#8ce5c7" font-size="25" font-weight="650">Match</text>
    <text x="572" y="204" fill="#ffc1ab" font-size="25" font-weight="650">Conflict</text>
  </g>
</svg>
